<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Zerostack Chat</title>
<style>
:root{
  --bg:#0b0e13; --bg2:#0f141b; --card:#141a22; --card2:#182029; --bd:#232c38;
  --tx:#e7edf5; --mut:#8b97a7; --mut2:#65707f;
  --ac:#4d8dff; --ac2:#7aa6ff; --ok:#31c46b; --warn:#e3b341; --bad:#ff6b6b;
  --user:#17212e; --asst:#141a22;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --r:12px;
}
html[data-theme="light"]{
  --bg:#f5f7fa; --bg2:#eef1f6; --card:#fff; --card2:#f7f9fc; --bd:#dfe4ec;
  --tx:#131820; --mut:#5f6b7a; --mut2:#8894a4;
  --ac:#2563eb; --ac2:#3b82f6; --ok:#128a4a; --warn:#a86900; --bad:#d92d20;
  --user:#eaf1fe; --asst:#fff;
  --sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px -16px rgba(16,24,40,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid transparent;
  background:var(--ac);color:#fff;padding:7px 13px;transition:.14s ease;white-space:nowrap}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
button.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
button.ghost:hover{background:var(--card2);border-color:var(--mut2)}
button.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
button.danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}
button.icon{padding:7px 9px;background:transparent;color:var(--mut);border-color:var(--bd)}
button.icon:hover{color:var(--tx);background:var(--card2)}
input,textarea,select{font:inherit;color:var(--tx);background:var(--card);
  border:1px solid var(--bd);border-radius:9px;padding:8px 11px;outline:none;transition:.14s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mut) 30%,transparent);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--mut) 55%,transparent);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),var(--bg);
  z-index:60;padding:20px}
#login .box{width:100%;max-width:390px;background:var(--card);border:1px solid var(--bd);
  border-radius:18px;padding:26px;box-shadow:var(--sh)}
#login h1{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
#login p{color:var(--mut);font-size:13px;margin:0 0 18px}
.brandmark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--ac),#8b5cf6);color:#fff;font-weight:700;font-size:17px;
  margin-bottom:14px;box-shadow:0 6px 18px -8px var(--ac)}

/* ---------- shell ---------- */
#shell{display:none;height:100%;flex-direction:column}
#shell.on{display:flex}

.topbar{display:flex;align-items:center;gap:14px;padding:9px 14px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bd);z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.2px;font-size:15px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.brand .dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 20%,transparent)}

.stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1;min-width:0}
.stat{min-width:104px}
.stat .lab{display:flex;justify-content:space-between;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--mut);margin-bottom:3px;font-weight:600}
.stat .lab b{color:var(--tx);font-weight:650;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--mut) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1),background .3s;
  background:linear-gradient(90deg,var(--ac),var(--ac2))}
.bar i.warn{background:linear-gradient(90deg,var(--warn),#f0c14b)}
.bar i.bad{background:linear-gradient(90deg,var(--bad),#ff8f8f)}
.spec{font-size:10.5px;color:var(--mut2);border-left:1px solid var(--bd);padding-left:12px;line-height:1.45;white-space:nowrap}
.spec b{color:var(--mut);font-weight:600}
.topacts{display:flex;gap:7px;align-items:center}
/* backend switcher: Pi | Zerostack */
.sw{display:flex;gap:0;border:1px solid var(--bd);border-radius:9px;overflow:hidden;flex:0 0 auto}
.sw button{background:transparent;color:var(--mut2);border:none;border-radius:0;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;line-height:1.4}
.sw button.on{background:var(--ac);color:#fff}
.sw button:hover:not(.on){color:var(--tx)}
@media (max-width:560px){.sw button{padding:5px 7px;font-size:11px}}

/* ---------- layout ---------- */
.app{display:flex;flex:1;min-height:0}
aside{width:298px;flex:0 0 298px;border-right:1px solid var(--bd);background:var(--bg2);
  display:flex;flex-direction:column;min-height:0;z-index:15}
.sidehead{padding:10px 11px;display:flex;gap:7px;border-bottom:1px solid var(--bd)}
.sidehead input{flex:1;min-width:0;font-size:13.5px;padding:7px 10px}
#sessList{flex:1;overflow-y:auto;padding:7px}
.sitem{padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;
  margin-bottom:3px;transition:.12s;position:relative}
.sitem:hover{background:var(--card2)}
.sitem.active{background:var(--card);border-color:var(--bd);box-shadow:var(--sh)}
.sitem.active:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:9px;background:var(--ac)}
.sitem .r1{display:flex;align-items:center;gap:6px}
.sitem .nm{flex:1;min-width:0;font-size:13.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .sbtn{flex:0 0 auto;width:22px;height:22px;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--mut2);font-size:13px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center}
.sitem:hover .sbtn{display:inline-flex}
.sitem .sbtn:hover{background:var(--card);color:var(--fg);border-color:var(--bd)}
.sitem .sbtn.del:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.sitem .r2{display:flex;gap:7px;align-items:center;margin-top:2px;font-size:11px;color:var(--mut2)}
.sitem .mdl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.sitem .cnt{font-variant-numeric:tabular-nums}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}
  50%{opacity:.65;box-shadow:0 0 0 5px transparent}}
.empty-side{padding:26px 14px;text-align:center;color:var(--mut2);font-size:12.5px}

main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chathead{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--bd);
  background:color-mix(in srgb,var(--bg2) 60%,transparent);flex-wrap:wrap;min-height:52px}
.chathead .ttl{font-weight:620;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;cursor:text;padding:2px 6px;border-radius:7px;border:1px solid transparent}
.chathead .ttl:hover{border-color:var(--bd);background:var(--card)}
.chathead .meta{font-size:11.5px;color:var(--mut2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chathead .sp{flex:1}
.chathead select{font-size:12.5px;padding:6px 9px;max-width:230px}
.chathead button{font-size:12.5px;padding:6px 10px}
#renameIn{display:none;font-size:14px;padding:5px 8px;width:min(320px,50vw)}
#menuBtn{display:none}

.log{flex:1;overflow-y:auto;padding:22px 20px 8px;scroll-behavior:smooth}
.log .inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:15px}
.msg{display:flex;gap:11px;align-items:flex-start;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.av{width:27px;height:27px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
.msg.user .av{background:linear-gradient(145deg,#3b82f6,#6366f1);color:#fff}
.msg.asst .av{background:linear-gradient(145deg,#10b981,#059669);color:#fff}
.bub{min-width:0;flex:1}
.who{font-size:11px;color:var(--mut2);margin-bottom:3px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.who b{color:var(--mut);font-weight:620;font-size:11.5px}
.who .ts{font-variant-numeric:tabular-nums}
.body{background:var(--asst);border:1px solid var(--bd);border-radius:var(--r);
  padding:11px 14px;box-shadow:var(--sh);overflow-wrap:anywhere}
.msg.user .body{background:var(--user);border-color:color-mix(in srgb,var(--ac) 25%,var(--bd))}
.body>*:first-child{margin-top:0}
.body>*:last-child{margin-bottom:0}
.body p{margin:.5em 0}
.body h1,.body h2,.body h3,.body h4{margin:.85em 0 .35em;line-height:1.25;letter-spacing:-.2px}
.body h1{font-size:1.28em}.body h2{font-size:1.16em}.body h3{font-size:1.05em}.body h4{font-size:1em}
.body ul,.body ol{margin:.45em 0;padding-left:1.35em}
.body li{margin:.16em 0}
.body code{background:color-mix(in srgb,var(--mut) 16%,transparent);padding:1.5px 5px;border-radius:5px;
  font-size:.88em;font-family:ui-monospace,Menlo,Consolas,monospace}
.body pre{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;
  overflow-x:auto;margin:.6em 0;font-size:12.5px;line-height:1.5}
.body pre code{background:none;padding:0;font-size:inherit}
.body a{color:var(--ac2);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--ac2) 40%,transparent)}
.body a:hover{border-bottom-color:var(--ac2)}
.body blockquote{margin:.55em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--bd);color:var(--mut)}
.body table{border-collapse:collapse;margin:.6em 0;font-size:13px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--bd);padding:5px 9px;text-align:left}
.body th{background:var(--bg2);font-weight:620}
.body hr{border:none;border-top:1px solid var(--bd);margin:.9em 0}
.body del{opacity:.7}

.tool{margin:.45em 0;border:1px solid var(--bd);border-radius:9px;background:var(--bg2);overflow:hidden}
.tool summary{cursor:pointer;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center;
  color:var(--mut);list-style:none;user-select:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary:before{content:"▸";font-size:9px;transition:.15s;color:var(--mut2)}
.tool[open] summary:before{transform:rotate(90deg)}
.tool summary:hover{background:var(--card2)}
.tool .tname{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ac2);font-weight:600}
.tool .tprev{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut2)}
.tool .tbody{padding:0 10px 9px;border-top:1px solid var(--bd)}
.tool pre{margin:7px 0 0;background:var(--card);border:1px solid var(--bd);border-radius:8px;
  padding:8px 10px;font-size:11.5px;max-height:340px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.tool .tlab{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut2);margin-top:8px;font-weight:650}
.tool.err .tname{color:var(--bad)}
.think{border:1px dashed color-mix(in srgb,var(--mut) 34%,transparent);border-radius:9px;
  padding:6px 10px;margin:.45em 0;font-size:12.5px;color:var(--mut)}
.think summary{cursor:pointer;font-size:11.5px;color:var(--mut2);list-style:none}
.think summary::-webkit-details-marker{display:none}
.think[open] summary{margin-bottom:6px}
.think pre{white-space:pre-wrap;margin:0;font-family:inherit;font-size:12.5px;line-height:1.55;color:var(--mut)}

.msgtail{font-size:10.5px;color:var(--mut2);margin-top:5px;padding-left:2px;
  font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap}
.live{border-left:2px solid var(--ac);padding-left:12px;margin-left:2px}
.livebar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.spinner{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ac) 30%,transparent);
  border-top-color:var(--ac);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor:after{content:"▍";color:var(--ac);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}

.welcome{max-width:560px;margin:56px auto;text-align:center;color:var(--mut);padding:0 10px}
.olderbar{text-align:center;padding:2px 0 10px}
.olderbar button{font-size:12px;padding:6px 14px;border-radius:99px}
.welcome .big{width:54px;height:54px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--ac),#8b5cf6);color:#fff;font-size:22px;font-weight:700;
  box-shadow:0 12px 30px -14px var(--ac)}
.welcome h2{margin:0 0 6px;font-size:19px;color:var(--tx);letter-spacing:-.3px}
.welcome p{margin:0 0 18px;font-size:13.5px}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.chip{font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);
  background:var(--card);color:var(--mut);cursor:pointer;transition:.14s}
.chip:hover{border-color:var(--ac);color:var(--tx)}

.composer{border-top:1px solid var(--bd);padding:11px 20px 14px;background:var(--bg2);flex:0 0 auto}
.composer .inner{max-width:860px;margin:0 auto}
.inputrow{display:flex;gap:9px;align-items:flex-end}
#prompt{flex:1;resize:none;min-height:44px;max-height:200px;padding:11px 13px;line-height:1.5;
  border-radius:12px;font-size:14.5px}
.sendwrap{display:flex;flex-direction:column;gap:6px}
.hintrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:10.5px;color:var(--mut2)}
kbd{font-family:inherit;font-size:10px;border:1px solid var(--bd);border-bottom-width:2px;
  border-radius:4px;padding:.5px 4px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--tx);
  color:var(--bg);padding:9px 17px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
  transition:.22s;z-index:90;max-width:90vw;text-align:center;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:14}

@media (max-width:820px){
  aside{position:fixed;left:0;top:0;bottom:0;width:86vw;max-width:330px;transform:translateX(-102%);
    transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.5);padding-top:6px;z-index:30}
  #scrim{z-index:25}
  aside.open{transform:none}
  #scrim.on{display:block}
  #menuBtn{display:inline-flex}
  .spec{display:none}
  .stats{gap:10px}
  .stat{min-width:78px}
  .log{padding:16px 12px 6px}
  .composer{padding:9px 11px 12px}
  .chathead{padding:8px 11px;gap:7px}
  .chathead select{max-width:150px}
  .brand span.bt{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="brandmark">π</div>
    <h1>Zerostack Chat</h1>
    <p>Unlock with your Pi opening password to chat with your sandbox.</p>
    <div style="display:flex;gap:8px">
      <input id="pw" type="password" placeholder="Opening password" style="flex:1;min-width:0" autocomplete="current-password">
      <button onclick="doLogin()">Unlock</button>
    </div>
    <div style="margin-top:11px;font-size:11.5px;color:var(--mut2)">
      Your opening password unlocks this page. The raw gateway token also works.
    </div>
  </div>
</div>

<div id="shell">
  <header class="topbar">
    <button class="icon" id="menuBtn" onclick="toggleSide()" title="Sessions" aria-label="Sessions">☰</button>
    <div class="brand"><span class="dot" id="gdot"></span><span class="bt">Zerostack Chat</span></div>
    <div class="stats">
      <div class="stat"><div class="lab">CPU <b id="cpuP">—</b></div><div class="bar"><i id="cpuB"></i></div></div>
      <div class="stat"><div class="lab">RAM <b id="ramP">—</b></div><div class="bar"><i id="ramB"></i></div></div>
      <div class="stat"><div class="lab">Disk <b id="dskP">—</b></div><div class="bar"><i id="dskB"></i></div></div>
      <div class="spec" id="spec">6 GiB RAM · 175% CPU · 10 GiB disk</div>
    </div>
    <div class="topacts">
      <button class="icon" onclick="location.href='/pi/settings'" title="Settings — skills, MCP, ACP, vault">⚙</button>
      <button class="icon" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">◐</button>
      <button class="icon" onclick="location.href='/admin'" title="Admin — keys &amp; models">▤</button>
      <button class="icon" onclick="location.href='/browser'" title="Browser — watch and take over">🖥</button>
    </div>
  </header>

  <div class="app">
    <aside id="side">
      <div class="sidehead">
        <input id="search" placeholder="Search chats…" oninput="renderSessions()">
        <button onclick="newChat()" title="New chat">+ New</button>
      </div>
      <div id="sessList"><div class="empty-side">Loading…</div></div>
    </aside>
    <div id="scrim" onclick="toggleSide(false)"></div>

    <main>
      <div class="chathead">
        <div class="ttl" id="sessTitle" onclick="startRename()" title="Click to rename">New chat</div>
        <input id="renameIn" onkeydown="renameKey(event)" onblur="commitRename()">
        <div class="meta" id="sessMeta"></div>
        <div class="sp"></div>
        <select id="modelSel" onchange="changeModel()" title="Model for this chat"></select>
        <button class="ghost" id="compactBtn" onclick="compact()" title="Compact context">Compact</button>
        <button class="ghost" onclick="doRename()" title="Rename chat">Rename</button>
        <button class="danger" id="delBtn" onclick="delSession()" title="Delete chat">Delete</button>
      </div>
      <div class="log" id="log"><div class="inner" id="logInner"></div></div>
      <div class="composer"><div class="inner">
        <div class="inputrow">
          <textarea id="prompt" rows="1" placeholder="Message Zerostack…"></textarea>
          <div class="sendwrap">
            <button id="sendBtn" onclick="send()">Send</button>
            <button class="danger" id="stopBtn" onclick="stopRun()" style="display:none">Stop</button>
          </div>
        </div>
        <div class="hintrow">
          <span><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline</span>
          <span id="statusLine"></span>
        </div>
      </div></div>
    </main>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* set() is the ONLY html sink. It never assigns innerHTML: the markup string is
   parsed in an inert document, run through an allow-list sanitizer (unknown
   tags unwrapped, every on* handler and javascript: URL dropped), then imported.
   Builders escape all dynamic values with esc(); md() escapes the whole source
   string before emitting its own tags. */
const OK_TAGS = new Set(("DIV SPAN P B STRONG EM DEL CODE PRE A UL OL LI BR HR " +
  "H2 H3 H4 H5 BLOCKQUOTE TABLE THEAD TBODY TR TH TD DETAILS SUMMARY BUTTON OPTION OPTGROUP").split(" "));
const OK_ATTR = new Set(["class", "href", "target", "rel", "title", "style",
  "data-lang", "data-id", "data-act", "data-q", "value", "selected", "label",
  "colspan", "rowspan"]);
const _parser = new DOMParser();
function _clean(root) {
  [...root.querySelectorAll("*")].forEach(el => {
    if (!OK_TAGS.has(el.tagName)) { el.replaceWith(...el.childNodes); return; }
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase();
      const bad = n.startsWith("on") ||
        ((n === "href" || n === "src") && /^\s*(javascript|data):/i.test(a.value));
      if (bad || !OK_ATTR.has(n)) el.removeAttribute(a.name);
    });
  });
}
const set = (el, html) => {
  const doc = _parser.parseFromString("<body>" + html + "</body>", "text/html");
  _clean(doc.body);
  const frag = document.createDocumentFragment();
  while (doc.body.firstChild) frag.appendChild(doc.body.firstChild); // move (adopt), NOT importNode: importNode clones and the loop never ends
  el.replaceChildren(frag);
};
const shortId = id => String(id || "").replace(/^.*_/, "").slice(0, 8);

let TOK = sessionStorage.getItem("zstok") || "";
let SESS = [], CUR = null, MSGS = [], STATS = null;
let MODELS = [], PENDING_MODEL = "";
let evCursor = 0, evTimer = null, listTimer = null, statsTimer = null;
const PAGE = 100;              // transcript window: render this many messages at a time
let shownCount = PAGE;         // how many of the tail are currently rendered
let pollMs = 10000, busy = false, lastAgentEnd = 0;
let statsFails = 0;
let sessFails = 0;
let sideSig = "";
let stream = { text: "", thinking: "", tools: [], active: false };
let modelCache = JSON.parse(localStorage.getItem("pi.modelCache") || "{}");

function toast(m, ms) {
  const t = $("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), ms || 3200);
}

/* ---------- api ---------- */
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({
    "Authorization": "Bearer " + TOK,
    "Content-Type": "application/json"
  }, opts.headers || {});
  const r = await fetch(path, opts);
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((d && d.error) || ("HTTP " + r.status));
  return d;
}

/* ---------- settings ---------- */
/* Settings is a full page now (/pi/settings), not a modal — the modal had a
   CSS bug where display:flex overrode the hidden attribute, so it showed on
   load stuck on Loading. The button navigates to /pi/settings instead.
   Returning from Settings with a skill: sessionStorage "zsSkill" holds the
   skill name; boot() puts "/prompt <skill>" in the prompt box. */

/* ---------- login ---------- */
function showLogin() {
  $("login").style.display = "flex";
  $("shell").classList.remove("on");
}
async function doLogin() {
  const v = $("pw").value.trim(); if (!v) return;
  $("pw").value = "";
  // A 43-char hex value is the gateway token, not a password — use it
  // directly (admin-parity-2026-11-20). Trying it as a password first
  // would burn a lockout try and can never succeed until an opening
  // password is set on the Admin page.
  if (/^[0-9a-f]{43}$/i.test(v)) { TOK = v; sessionStorage.setItem("zstok", TOK); return boot(); }
  try {
    const r = await fetch("/admin-login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: v })
    });
    if (r.ok) {
      const d = await r.json();
      TOK = d.token;
      sessionStorage.setItem("zstok", TOK);
      return boot();
    }
  } catch (e) {}
  // raw gateway token fallback (same as /admin)
  TOK = v; sessionStorage.setItem("zstok", TOK); boot();
}
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

/* ---------- theme ---------- */
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nxt);
  localStorage.setItem("pi.theme", nxt);
}
document.documentElement.setAttribute("data-theme", localStorage.getItem("pi.theme") || "dark");

/* ---------- boot ---------- */
async function boot() {
  $("login").style.display = "none";
  $("shell").classList.add("on");
  // Coming back from /pi/settings with a skill to load: put it in the box.
  const sk = sessionStorage.getItem("zsSkill");
  if (sk) {
    sessionStorage.removeItem("zsSkill");
    const inp = $("prompt");
    if (inp) { inp.value = "/prompt " + sk; inp.focus(); autoGrow(); toast("Skill " + sk + " — press Send to load it"); }
  }
  // Stats and models are fire-and-forget: a slow /models or /stats must never
  // delay the transcript, and a stats failure must not block anything else.
  loadStats();
  loadModels().catch(() => {});
  try {
    await loadSessions();
    restoreLast();
  } catch (e) { toast("Load failed: " + e.message, 5000); }
  startLoops();
}
function startLoops() {
  clearInterval(statsTimer);  statsTimer = setInterval(loadStats, 5000);
  clearInterval(listTimer);
  listTimer = setInterval(loadSessions, 10000);
  clearInterval(evTimer);
  evTimer = setInterval(pollEvents, pollMs);
}

/* ---------- stats ---------- */
function barPct(v) {
  const p = Math.max(0, Math.min(100, v || 0));
  return p;
}
function paintBar(el, pctEl, v) {
  const p = barPct(v);
  el.style.width = p.toFixed(1) + "%";
  el.className = p >= 90 ? "bad" : (p >= 70 ? "warn" : "");
  pctEl.textContent = v == null ? "—" : Math.round(p) + "%";
}
async function loadStats() {
  try {
    const s = await api("/stats");
    STATS = s;
    paintBar($("cpuB"), $("cpuP"), s.cpu && s.cpu.pct);
    paintBar($("ramB"), $("ramP"), s.ram && s.ram.pct);
    paintBar($("dskB"), $("dskP"), s.disk && s.disk.pct);
    if (s.spec) set($("spec"),
      esc(s.spec.ram || "6 GiB") + " RAM · " + esc(s.spec.cpu || "175%") + " CPU · " +
      esc(s.spec.disk || "10 GiB") + " disk");
    $("gdot").classList.remove("bad");
    statsFails = 0;
  } catch (e) {
    if (e.message === "unauthorized") return;
    $("gdot").classList.add("bad");
    // retry quickly rather than waiting for the next 5s tick
    if (statsFails++ < 6) setTimeout(loadStats, 2000);
  }
}

/* ---------- models ---------- */
async function loadModels() {
  const d = await api("/models");
  MODELS = [];
  const provs = (d && d.providers) || {};
  Object.keys(provs).forEach(p => {
    (provs[p].models || []).forEach(m => {
      if (m && m.id) MODELS.push({ key: p + "/" + m.id, provider: p, id: m.id });
    });
  });
  MODELS.sort((a, b) => a.provider.localeCompare(b.provider) || a.id.localeCompare(b.id));
  renderModelSel();
}
function renderModelSel() {
  // Build with DOM APIs, NOT set(): the HTML parser drops <option> /
  // <optgroup> tokens outside a <select>, so set() can never render them.
  const sel = $("modelSel");
  const want = CUR ? (modelCache[CUR] || PENDING_MODEL) : PENDING_MODEL;
  sel.replaceChildren();
  const ph = document.createElement("option");
  ph.value = ""; ph.textContent = "model…";
  sel.appendChild(ph);
  let lastP = null, grp = null;
  MODELS.forEach(m => {
    if (m.provider !== lastP) {
      grp = document.createElement("optgroup");
      grp.label = m.provider;
      sel.appendChild(grp);
      lastP = m.provider;
    }
    const o = document.createElement("option");
    o.value = m.key; o.textContent = m.id;
    if (m.key === want) o.selected = true;
    grp.appendChild(o);
  });
}

/* ---------- sessions ---------- */
function anyRunning() { return SESS.some(s => s.running); }
function ago(ts) {
  if (!ts) return "";
  let ms = ts < 1e12 ? ts * 1000 : ts;
  const d = Date.now() - ms;
  if (d < 60000) return "now";
  if (d < 3600000) return Math.floor(d / 60000) + "m";
  if (d < 86400000) return Math.floor(d / 3600000) + "h";
  return Math.floor(d / 86400000) + "d";
}
async function loadSessions(silent) {
  try {
    const list = await api("/sessions");
    // Pi keeps timestamped snapshot files next to the live session file
    // (2026-11-19T09-14-30-020Z_<uuid> vs <uuid>): same chat, listed twice.
    // Keep only the newest entry per base id.
    const byBase = new Map();
    (list || []).forEach(s => {
      const base = String(s.id || "").replace(/^\d{4}-\d{2}-\d{2}T[\d-]+Z_/, "");
      const prev = byBase.get(base);
      if (!prev || (s.mtime || 0) > (prev.mtime || 0)) byBase.set(base, s);
    });
    SESS = [...byBase.values()];
    SESS.sort((a, b) => (b.running ? 1 : 0) - (a.running ? 1 : 0) || (b.mtime || 0) - (a.mtime || 0));
    renderSessions();
    sessFails = 0;
    const target = anyRunning() ? 2000 : 10000;
    if (target !== pollMs) { pollMs = target; clearInterval(evTimer); evTimer = setInterval(pollEvents, pollMs); }
    clearInterval(listTimer); listTimer = setInterval(loadSessions, pollMs);
  } catch (e) {
    if (e.message === "unauthorized") return;
    sessFails++;
    if (!silent && sessFails === 3) toast("Sessions: " + e.message);
  }
}
function renderSessions(force) {
  const q = ($("search").value || "").toLowerCase().trim();
  const el = $("sessList");
  const list = SESS.filter(s =>
    !q || String(s.name || "").toLowerCase().includes(q) ||
    String(s.model || "").toLowerCase().includes(q) || String(s.id).toLowerCase().includes(q));
  // Only touch the DOM when something the sidebar actually shows has changed —
  // while a run is active this is polled every 2s and rebuilding it each time
  // makes the list flicker and burns cycles on a phone.
  const sig = q + "|" + CUR + "|" + list.map(s =>
    [s.id, s.running ? 1 : 0, s.mtime || 0, s.messages || 0,
     s.name || "", s.model || modelCache[s.id] || ""].join("~")).join("|");
  if (!force && sig === sideSig) return;
  sideSig = sig;
  if (!list.length) {
    set(el, '<div class="empty-side">' +
      (SESS.length ? "No matches." : "No chats yet. Hit <b>+ New</b> to start one.") + "</div>");
    return;
  }
  set(el, list.map(s => {
    const named = (s.name && s.name !== s.id);
    const nm = named ? s.name : "New chat";
    const mdl = s.model || modelCache[s.id] || "";
    return '<div class="sitem' + (s.id === CUR ? " active" : "") + '" data-id="' + esc(s.id) + '" data-act="open">' +
      '<div class="r1">' + (s.running ? '<span class="pulse"></span>' : "") +
      '<span class="nm">' + esc(nm) + "</span>" +
      '<button class="sbtn" data-act="sren" data-id="' + esc(s.id) + '" title="Rename chat">✎</button>' +
      '<button class="sbtn del" data-act="sdel" data-id="' + esc(s.id) + '" title="Delete chat">×</button></div>' +
      '<div class="r2">' + (mdl ? '<span class="mdl" title="' + esc(mdl) + '">' + esc(mdl.split("/").pop()) + "</span>" :
        '<span class="mdl">—</span>') +
      '<span class="cnt">' + (s.messages || 0) + " msg</span>" +
      "<span>" + ago(s.mtime) + "</span></div></div>";
  }).join(""));
}

/* ---------- transcript ---------- */
function fmtTime(ts) {
  if (!ts) return "";
  let ms = typeof ts === "number" ? (ts < 1e12 ? ts * 1000 : ts) : Date.parse(ts);
  if (!ms || isNaN(ms)) return "";
  const d = new Date(ms);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function num(n) {
  if (n == null) return "0";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return String(n);
}

async function selectSession(id) {
  if (CUR === id) { toggleSide(false); return; }
  CUR = id;
  evCursor = 0;
  shownCount = PAGE;

  } catch (e) { toast("Open failed: " + e.message, 5000); }

async function loadTranscript() {
  const d = await api("/sessions/" + encodeURIComponent(CUR));
  const raw = (d.messages && d.messages.data && d.messages.data.messages) ||
              (d.messages && Array.isArray(d.messages) ? d.messages : []) || [];
  MSGS = raw;
  const st = (d.stats && d.stats.data) || {};
  // learn model + name
  for (let i = MSGS.length - 1; i >= 0; i--) {
    const m = MSGS[i];
    if (m && m.role === "assistant" && m.model) {
      const k = (m.provider ? m.provider + "/" : "") + m.model;
      if (k !== modelCache[CUR]) { modelCache[CUR] = k; localStorage.setItem("pi.modelCache", JSON.stringify(modelCache)); }
      break;
    }
  }
  const meta = [];
  if (st.userMessages != null) meta.push(st.userMessages + " you");
  if (st.assistantMessages != null) meta.push(st.assistantMessages + " pi");
  if (st.tokens && st.tokens.input != null)
    meta.push(num(st.tokens.input + (st.tokens.output || 0)) + " tok");
  $("sessMeta").textContent = meta.join(" · ");
  const s = SESS.find(x => x.id === CUR);
  $("sessTitle").textContent = (s && s.name && s.name !== s.id) ? s.name : "New chat";
  renderLog();
  updateRunBtns();
}

/* ---------- markdown ---------- */
function md(src) {
  if (src == null || src === "") return "";
  let s = String(src).replace(/\r/g, "");
  const fences = [];
  s = s.replace(/```([^\n`]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    fences.push({ lang: (lang || "").trim(), code: code });
    return "\u0001F" + (fences.length - 1) + "\u0001";
  });
  s = esc(s);
  const inls = [];
  s = s.replace(/`([^`\n]+)`/g, (m, c) => { inls.push(c); return "\u0001C" + (inls.length - 1) + "\u0001"; });

  const inline = t => t
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

  const lines = s.split("\n");
  const out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };

  while (i < lines.length) {
    const ln = lines[i];
    if (/^\u0001F\d+\u0001$/.test(ln.trim())) { flush(); out.push(ln.trim()); i++; continue; }
    if (!ln.trim()) { flush(); i++; continue; }
    if (/^\u0001C\d+\u0001$/.test(ln.trim())) { para.push(ln.trim()); i++; continue; }

    let m = ln.match(/^(#{1,6})\s+(.*)$/);
    if (m) { flush(); const lv = Math.min(m[1].length + 1, 5); out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"); i++; continue; }
    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(ln)) { flush(); out.push("<hr>"); i++; continue; }

    // table
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let html = "<table><thead><tr>" + cells(ln).map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        html += "<tr>" + cells(lines[i]).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>";
        i++;
      }
      out.push(html + "</tbody></table>");
      continue;
    }

    if (/^\s*>\s?/.test(ln)) {
      flush(); const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + inline(buf.join(" ")) + "</blockquote>");
      continue;
    }

    if (/^\s*[-*+]\s+/.test(ln)) {
      flush(); const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push("<li>" + inline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>"); i++;
      }
      out.push("<ul>" + items.join("") + "</ul>");
      continue;
    }
    if (/^\s*\d+[.)]\s+/.test(ln)) {
      flush(); const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        items.push("<li>" + inline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"); i++;
      }
      out.push("<ol>" + items.join("") + "</ol>");
      continue;
    }
    para.push(ln.trim()); i++;
  }
  flush();

  let html = out.join("\n");
  html = html.replace(/\u0001F(\d+)\u0001/g, (m, n) => {
    const f = fences[+n]; if (!f) return "";
    return '<pre><code data-lang="' + esc(f.lang) + '">' + esc(f.code.replace(/\n$/, "")) + "</code></pre>";
  });
  html = html.replace(/\u0001C(\d+)\u0001/g, (m, n) => "<code>" + (inls[+n] || "") + "</code>");
  return html;
}

/* ---------- render log ---------- */
function blocksToHtml(m, results) {
  const c = m.content;
  let blocks = [];
  if (typeof c === "string") blocks = c ? [{ type: "text", text: c }] : [];
  else if (Array.isArray(c)) blocks = c;
  let html = "";
  blocks.forEach(b => {
    if (!b || typeof b !== "object") return;
    if (b.type === "text" && b.text) html += '<div class="md">' + md(b.text) + "</div>";
    else if (b.type === "thinking" && b.thinking)
      html += '<details class="think"><summary>thinking</summary><pre>' + esc(b.thinking) + "</pre></details>";
    else if (b.type === "toolCall") {
      const res = results[b.id];
      const prev = (() => {
        const a = b.arguments || {};
        const v = a.command || a.path || a.code || a.query || a.url || a.message || "";
        return String(typeof v === "string" ? v : JSON.stringify(v)).replace(/\s+/g, " ").slice(0, 150);
      })();
      html += '<details class="tool' + ((res && res.isError) ? " err" : "") + '">' +
        '<summary><span class="tname">' + esc(b.name || "tool") + "</span>" +
        '<span class="tprev">' + esc(prev) + "</span></summary>" +
        '<div class="tbody"><div class="tlab">arguments</div><pre>' +
        esc(JSON.stringify(b.arguments || {}, null, 1)) + "</pre>";
      if (res) {
        html += '<div class="tlab">result' + (res.durationMs ? " · " + res.durationMs + " ms" : "") + "</div><pre>" +
          esc(typeof res.text === "string" ? res.text.slice(0, 8000) : JSON.stringify(res.text, null, 1).slice(0, 8000)) + "</pre>";
      }
      html += "</div></details>";
    }
  });
  return html;
}

/* Build the HTML for a single message (user or assistant). */
function msgHtml(m, results) {
  if (!m) return "";
  if (m.role === "user") {
    let txt = "";
    if (typeof m.content === "string") txt = m.content;
    else if (Array.isArray(m.content)) txt = m.content.filter(c => c && c.type === "text").map(c => c.text).join("\n");
    if (!txt.trim()) return "";
    return '<div class="msg user"><div class="av">You</div><div class="bub">' +
      '<div class="who"><b>You</b><span class="ts">' + fmtTime(m.timestamp) + "</span></div>" +
      '<div class="body">' + md(txt) + "</div></div></div>";
  }
  if (m.role === "assistant") {
    const body = blocksToHtml(m, results);
    const tail = [];
    if (m.model) tail.push((m.provider ? m.provider + "/" : "") + m.model);
    if (m.usage && m.usage.totalTokens) tail.push(num(m.usage.totalTokens) + " tok");
    if (m.durationMs) tail.push((m.durationMs / 1000).toFixed(1) + "s");
    return '<div class="msg asst"><div class="av">π</div><div class="bub">' +
      '<div class="who"><b>Zerostack</b><span class="ts">' + fmtTime(m.timestamp) + "</span></div>" +
      '<div class="body">' + (body || '<span class="mut">(no text)</span>') + "</div>" +
      (tail.length ? '<div class="msgtail"><span>' + esc(tail.join(" · ")) + "</span></div>" : "") +
      "</div></div>";
  }
  return "";
}

/* HTML for the live streaming bubble body only. */
function liveBodyHtml() {
  let body = "";
  if (stream.thinking)
    body += '<details class="think"><summary>thinking…</summary><pre>' + esc(stream.thinking) + "</pre></details>";
  if (stream.text) body += '<div class="md">' + md(stream.text) + "</div>";
  if (stream.tools.length) body += stream.tools.map(t =>
    '<div class="tool"><summary style="cursor:default"><span class="tname">' + esc(t.name || "tool") +
    '</span><span class="tprev">running…</span></summary></div>').join("");
  return body || '<span class="mut">working…</span>';
}

/* Update ONLY the live bubble. Called on every token chunk, so it must never
   touch the rest of the transcript (that was the 2000-message freeze). */
function updateLive() {
  const el = $("liveBody");
  if (!el) return;
  set(el, liveBodyHtml());
  const sc = $("log");
  sc.scrollTop = sc.scrollHeight;
}

function renderLog() {
  const el = $("logInner");
  const scroller = $("log");
  const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;

  if (!CUR) {
    set(el,
      '<div class="welcome"><div class="big">π</div><h2>Start a new chat</h2>' +
      "<p>Ask anything — Zerostack can read files, run commands and edit code on your sandbox.</p>" +
      '<div class="chips">' +
      '<span class="chip" data-q="What is running on this box right now?">What is running?</span>' +
      '<span class="chip" data-q="Check disk and memory usage and summarise the health of the box">Box health</span>' +
      '<span class="chip" data-q="List the files in /root/work and summarise the projects">/root/work</span>' +
      "</div></div>");
    return;
  }

  const use = MSGS.filter(m => m && m.role !== "system");
  if (!use.length && !stream.active) {
    set(el, '<div class="welcome"><div class="big">π</div><h2>Empty chat</h2><p>Send the first message below.</p></div>');
    return;
  }

  // Index tool results once per render.
  const results = {};
  for (let i = 0; i < use.length; i++) {
    const m = use[i];
    if (m.role === "toolResult") {
      const txt = Array.isArray(m.content)
        ? m.content.map(c => (c && c.type === "text") ? c.text : "").join("")
        : String(m.content || "");
      results[m.toolCallId] = { text: txt, isError: !!m.isError, durationMs: m.durationMs };
    }
  }

  // Window: render only the last `shownCount` messages. A 2000-message session
  // re-parsing all 2000 markdown blobs per render is what froze the page.
  const total = use.length;
  const start = Math.max(0, total - shownCount);
  let html = "";

  if (start > 0) {
    html += '<div class="olderbar"><button class="ghost" data-act="older">' +
      "Show older messages (" + start + " more)</button></div>";
  }
  for (let i = start; i < total; i++) html += msgHtml(use[i], results);

  if (stream.active) {
    html += '<div class="msg asst live"><div class="av">π</div><div class="bub">' +
      '<div class="livebar"><span class="spinner"></span> Zerostack is working</div>' +
      '<div class="body cursor" id="liveBody">' + liveBodyHtml() + "</div></div></div>";
  }

  set(el, html);
  if (atBottom || stream.active) scroller.scrollTop = scroller.scrollHeight;
}

function showOlder() {
  shownCount += PAGE;
  renderLog();
  $("log").scrollTop = 0;
}

/* ---------- events ---------- */
async function pollEvents() {
  if (!CUR || !TOK) return;
  try {
    const d = await api("/sessions/" + encodeURIComponent(CUR) + "/events?since=" + evCursor);
    const evs = d.events || [];
    evCursor = typeof d.next === "number" ? d.next : evCursor + evs.length;
    if (evs.length) handleEvents(evs);
  } catch (e) { /* transient */ }
}
let refreshAt = 0;
function scheduleTranscript(ms) {
  const now = Date.now();
  if (now - refreshAt < 900) return;
  refreshAt = now;
  setTimeout(() => { loadTranscript().catch(() => {}); }, ms || 0);
}
function handleEvents(evs) {
  // Two kinds of updates:
  //   liveOnly  -> token deltas: patch ONLY #liveBody, never the transcript
  //   full      -> structural change: rebuild the transcript window
  let liveOnly = false, full = false, liveDirty = false;
  evs.forEach(ev => {
    const t = ev && ev.type;
    if (t === "agent_start") {
      stream = { text: "", thinking: "", tools: [], active: true };
      setRunning(true); full = true;
    } else if (t === "agent_end" || t === "agent_settled") {
      stream.active = false; setRunning(false); full = true;
      lastAgentEnd = Date.now(); scheduleTranscript(250); loadSessions(true);
    } else if (t === "message_update") {
      const a = ev.assistantMessageEvent || {};
      if (a.type === "text_delta") {
        stream.text += a.delta || ""; stream.active = true; liveOnly = true; liveDirty = true;
      } else if (a.type === "thinking_delta") {
        stream.thinking += a.delta || ""; stream.active = true; liveOnly = true; liveDirty = true;
      } else if (a.type === "text_start") {
        stream.text = "";
      } else if (a.type === "thinking_start") {
        stream.thinking = "";
      } else if (a.type === "toolcall_start") {
        stream.tools.push({ name: a.toolName, id: a.id });
        stream.text = ""; stream.thinking = ""; stream.active = true; full = true;
      } else if (a.type === "toolcall_end") {
        stream.text = ""; stream.thinking = ""; liveDirty = true;
      } else if (a.type === "text_end") {
        /* keep streaming text until message_end */
      }
    } else if (t === "tool_execution_start") {
      stream.active = true; stream.text = ""; stream.thinking = "";
      $("statusLine").textContent = "running " + (ev.toolName || "tool") + "…";
      full = true;
    } else if (t === "tool_execution_end") {
      $("statusLine").textContent = ""; full = true;
    } else if (t === "turn_end" || t === "message_end") {
      full = true;
    } else if (t === "session_info_changed") {
      loadSessions(true); scheduleTranscript(300);
    }
  });
  if (full) {
    renderLog();                      // also (re)creates #liveBody
    if (liveDirty) updateLive();
  } else if (liveOnly && liveDirty) {
    updateLive();                     // cheap path: one node, no transcript rebuild
  }
}


/* ---------- running state ---------- */
function setRunning(on) {
  busy = on;
  $("stopBtn").style.display = on ? "inline-block" : "none";
  $("sendBtn").disabled = false;
  $("sendBtn").textContent = on ? "Queue" : "Send";
  $("statusLine").textContent = on ? "running…" : "";
  if (on) { pollMs = 2000; clearInterval(evTimer); evTimer = setInterval(pollEvents, 2000); }
  updateRunBtns();
}
function updateRunBtns() {
  const s = SESS.find(x => x.id === CUR);
  const on = !!(s && s.running) || stream.active;
  $("stopBtn").style.display = on ? "inline-block" : "none";
  $("sendBtn").textContent = on ? "Queue" : "Send";
}

/* ---------- actions ---------- */
function toggleSide(force) {
  const a = $("side"), s = $("scrim");
  const open = force === undefined ? !a.classList.contains("open") : force;
  a.classList.toggle("open", open);
  s.classList.toggle("on", open);
}
function newChat() {
  CUR = null; MSGS = []; stream = { text: "", thinking: "", tools: [], active: false };
  shownCount = PAGE;
  localStorage.removeItem("pi.last");
  $("sessTitle").textContent = "New chat";
  $("sessMeta").textContent = "";
  renderSessions(); renderModelSel(); renderLog();
  $("stopBtn").style.display = "none";
  $("sendBtn").textContent = "Send";
  toggleSide(false);
  $("prompt").focus();
}
function quick(text) { $("prompt").value = text; autoGrow(); $("prompt").focus(); }

async function send() {
  const ta = $("prompt");
  const msg = ta.value.trim();
  if (!msg) return;
  if (!TOK) return showLogin();
  ta.value = ""; autoGrow();
  stream = { text: "", thinking: "", tools: [], active: true };
  setRunning(true);
  renderLog();
  try {
    let sid = CUR;
    if (sid) {
      await api("/prompt", { method: "POST", body: JSON.stringify({ session_id: sid, message: msg }) });
    } else {
      const name = msg.replace(/\s+/g, " ").slice(0, 48) + (msg.length > 48 ? "…" : "");
      const body = { message: msg, name: name };
      const m = $("modelSel").value;
      if (m) body.model = m;
      const r = await api("/prompt", { method: "POST", body: JSON.stringify(body) });
      sid = r.session_id;
      if (!sid) throw new Error("no session id returned");
      CUR = sid;
      localStorage.setItem("pi.last", sid);
    }
    evCursor = 0;
    await loadSessions(true);
    setTimeout(() => loadTranscript().catch(() => {}), 500);
    // also show the user's message immediately
    MSGS = MSGS.concat([{ role: "user", content: [{ type: "text", text: msg }], timestamp: Date.now() }]);
    renderLog();
  } catch (e) {
    stream.active = false; setRunning(false);
    toast("Send failed: " + e.message, 5000);
    ta.value = msg; autoGrow();
  }
}
async function stopRun() {
  if (!CUR) return;
  $("stopBtn").disabled = true;
  try {
    await api("/sessions/" + encodeURIComponent(CUR) + "/stop", { method: "POST", body: "{}" });
    toast("Stopped");
  } catch (e) { toast("Stop failed: " + e.message); }
  $("stopBtn").disabled = false;
  setTimeout(() => { stream.active = false; setRunning(false); scheduleTranscript(300); }, 400);
}
async function changeModel() {
  const v = $("modelSel").value;
  if (!v) return;
  if (!CUR) { PENDING_MODEL = v; toast("Model set for the next new chat"); return; }
  try {
    await api("/sessions/" + encodeURIComponent(CUR) + "/model",
      { method: "POST", body: JSON.stringify({ model: v }) });
    modelCache[CUR] = v; localStorage.setItem("pi.modelCache", JSON.stringify(modelCache));
    toast("Model switched to " + v);
    loadSessions(true);
  } catch (e) { toast("Model switch failed: " + e.message, 5000); }
}
async function compact() {
  if (!CUR) return toast("Open a chat first");
  const b = $("compactBtn"); b.disabled = true; b.textContent = "Compacting…";
  try {
    await api("/sessions/" + encodeURIComponent(CUR) + "/compact", { method: "POST", body: "{}" });
    toast("Context compacted");
    loadTranscript().catch(() => {});
  } catch (e) { toast("Compact failed: " + e.message, 5000); }
  b.disabled = false; b.textContent = "Compact";
}
function startRename() {
  if (!CUR) return;
  const t = $("sessTitle"), inp = $("renameIn");
  const s = SESS.find(x => x.id === CUR);
  inp.value = (s && s.name && s.name !== s.id) ? s.name : "";
  t.style.display = "none"; inp.style.display = "inline-block";
  inp.focus(); inp.select();
}
function renameKey(e) {
  if (e.key === "Enter") { e.preventDefault(); commitRename(); }
  if (e.key === "Escape") { $("renameIn").style.display = "none"; $("sessTitle").style.display = ""; }
}
async function commitRename() {
  const inp = $("renameIn");
  if (inp.style.display === "none") return;
  const name = inp.value.trim();
  inp.style.display = "none"; $("sessTitle").style.display = "";
  if (!CUR || !name) return;
  try {
    await api("/sessions/" + encodeURIComponent(CUR) + "/rename",
      { method: "POST", body: JSON.stringify({ name: name }) });
    const s = SESS.find(x => x.id === CUR); if (s) s.name = name;
    $("sessTitle").textContent = name;
    renderSessions(); toast("Renamed");
  } catch (e) { toast("Rename failed: " + e.message); }
}
function doRename() { if (!CUR) return toast("Open a chat first"); startRename(); }
async function delSession() {
  if (!CUR) return toast("Open a chat first");
  const s = SESS.find(x => x.id === CUR);
  const nm = (s && s.name && s.name !== s.id) ? s.name : "New chat";
  if (!confirm('Delete chat "' + nm + '"?\n\nThis removes the session file on the box and cannot be undone.')) return;
  try {
    await api("/sessions/" + encodeURIComponent(CUR), { method: "DELETE" });
    toast("Deleted");
    const keep = CUR; CUR = null; MSGS = [];
    SESS = SESS.filter(x => x.id !== keep);
    newChat(); loadSessions(true);
  } catch (e) { toast("Delete failed: " + e.message, 5000); }
}

/* ---------- composer ---------- */
function autoGrow() {
  const ta = $("prompt");
  ta.style.height = "auto";
  ta.style.height = Math.min(200, ta.scrollHeight) + "px";
}
$("prompt").addEventListener("input", autoGrow);
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("search").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; renderSessions(); } });

/* event delegation for dynamically built rows/chips (the sanitizer strips
   inline on* handlers, so nothing injected via set() can carry its own) */
$("sessList").addEventListener("click", async e => {
  // Per-session rename / delete buttons live inside the row — handle them
  // first so they do not also trigger opening the session.
  const del = e.target.closest("[data-act='sdel']");
  if (del && del.dataset.id){
    e.stopPropagation();
    const id = del.dataset.id;
    const s = SESS.find(x => x.id === id);
    const nm = (s && s.name && s.name !== s.id) ? s.name : "New chat";
    if (!confirm('Delete chat "' + nm + '"?\n\nThis removes the session file on the box and cannot be undone.')) return;
    try {
      await api("/sessions/" + encodeURIComponent(id), { method: "DELETE" });
      toast("Deleted");
      if (CUR === id){ CUR = null; MSGS = []; }
      loadSessions(true); renderLog();
    } catch(err){ toast(err.message); }
    return;
  }
  const ren = e.target.closest("[data-act='sren']");
  if (ren && ren.dataset.id){
    e.stopPropagation();
    const id = ren.dataset.id;
    const s = SESS.find(x => x.id === id);
    const cur = (s && s.name && s.name !== s.id) ? s.name : "";
    const name = prompt("Rename chat:", cur);
    if (name === null) return;
    const nm = name.trim();
    if (!nm) return;
    try {
      await api("/sessions/" + encodeURIComponent(id) + "/rename",
        { method: "POST", body: JSON.stringify({ name: nm }) });
      if (CUR === id) $("sessTitle").textContent = nm;
      loadSessions(true);
    } catch(err){ toast(err.message); }
    return;
  }
  const item = e.target.closest("[data-act='open']");
  if (item && item.dataset.id) selectSession(item.dataset.id);
});
$("logInner").addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-q]");
  if (chip) { quick(chip.dataset.q); return; }
  const older = e.target.closest("[data-act='older']");
  if (older) showOlder();
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault(); $("search").focus(); $("search").select();
  }
});

/* ---------- restore ---------- */
function restoreLast() {
  const last = localStorage.getItem("pi.last");
  if (last && SESS.some(s => s.id === last)) selectSession(last);
  else if (SESS.length) selectSession(SESS[0].id);
  else renderLog();
}

/* ---------- init ---------- */
if (TOK) { boot(); } else { showLogin(); }
setInterval(() => { // keep the header dot honest even if /stats is the only poller
  if (STATS && STATS.updated && Date.now() / 1000 - STATS.updated > 30 && $("shell").classList.contains("on"))
    $("gdot").classList.add("bad");
}, 15000);
</script>
